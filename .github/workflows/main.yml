name: Main workflow

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  # The versions of OCaml to test, the last one being the latest: the job
  # fatalwarnings and the npm package use it
  versions:
    name: OCaml versions
    runs-on: ubuntu-latest
    outputs:
      compilers: ${{ steps.versions.outputs.compilers }}
      latest: ${{ steps.versions.outputs.latest }}
    steps:
      - id: versions
        env:
          COMPILERS: '["4.14.x", "5.5.x"]'
        run: |
          echo "compilers=$COMPILERS" >> "$GITHUB_OUTPUT"
          echo "latest=$(jq -r '.[-1]' <<< "$COMPILERS")" >> "$GITHUB_OUTPUT"

  build:
    name: Build and test elpi
    needs: versions
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
        ocaml-compiler: ${{ fromJSON(needs.versions.outputs.compilers) }}
        profile:
          - dev
        include:
          - os: ubuntu-latest
            ocaml-compiler: ${{ needs.versions.outputs.latest }}
            profile: fatalwarnings

    runs-on: ${{ matrix.os }}

    # dune builds in the release profile (smaller binaries; the web build,
    # webrunner, is in the release profile anyway, see the Makefile), but in the
    # job fatalwarnings, which turns the warnings of the dev profile into
    # errors (see the root dune)
    env:
      DUNE_PROFILE: ${{ matrix.profile == 'fatalwarnings' && 'dev' || 'release' }}

    steps:
    
      - name: Set git to use LF
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Checkout code
        uses: actions/checkout@v4

# Environment setup ###########################################################
# 
# We install missing bits and we mae ${{ env.workspace }} points to the current
# working directory in a system agnostic way
#
# Note "opam exec -- stuff" executes stuff in a "system independent way" inside
# the opam root *but* the way "stuff" is parsed is not system independent.
# Hence we use GH's ${{ expressions }} rather than the ones from the shell.

      - name: Use OCaml ${{ matrix.ocaml-compiler }}
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml-compiler }}
          opam-local-packages:

      - name: Extra setup on Linux
        if: runner.os == 'Linux'
        run: |
          opam exec -- echo "workspace=${{ github.workspace }}" >> $GITHUB_ENV
          sudo apt-get install wdiff

      - name: Extra setup on macOS
        if: runner.os == 'macOS'
        run: |
          brew install gnu-time
          brew install wdiff
          opam exec -- echo "workspace=${{ github.workspace }}" >> $GITHUB_ENV

      - name: Extra setup on Windows
        if: runner.os == 'Windows'
        run: |
          opam exec -- cygpath -m ${{ github.workspace }} | % {$_ -replace "^","workspace=" }  | Out-File -FilePath $Env:GITHUB_ENV -Encoding utf8 -Append
          opam exec -- sed -i ' ' tests/sources/*.elpi
          opam init --reinit --cygwin-extra-packages=time,which,wdiff
#          & "C:/.opam/.cygwin/setup-x86_64.exe" -s https://mirrors.kernel.org/sourceware/cygwin/ -v -q -P time,which,wdiff

# Build ######################################################################
#
# We generate binaries like elpi-4.07.1-Linux.exe in the working directory
  
      - name: Install real dependencies
        run: |
          opam install ./elpi.opam --deps-only --with-doc --with-test

      - name: Enable warn as errors
        if: runner.os == 'Linux' && matrix.profile == 'fatalwarnings'
        run: sed -ibak 's/-A/+A/' dune

      - name: Build elpi
        run: |
          opam exec -- dune subst
          opam exec -- make build DUNE_OPTS=--verbose
          opam exec -- cp _build/install/default/bin/elpi elpi-${{ matrix.ocaml-compiler }}-${{ runner.os }}.exe
          opam exec -- chmod u+w ${{ env.workspace }}/elpi-${{ matrix.ocaml-compiler }}-${{ runner.os }}.exe
          opam exec -- strip ${{ env.workspace }}/elpi-${{ matrix.ocaml-compiler }}-${{ runner.os }}.exe
          opam exec -- cp _build/install/default/bin/elpi-trace-elaborator elpi-trace-elaborator-${{ matrix.ocaml-compiler }}-${{ runner.os }}.exe
          opam exec -- chmod u+w ${{ env.workspace }}/elpi-trace-elaborator-${{ matrix.ocaml-compiler }}-${{ runner.os }}.exe
          opam exec -- strip ${{ env.workspace }}/elpi-trace-elaborator-${{ matrix.ocaml-compiler }}-${{ runner.os }}.exe

# Test ######################################################################
#
# We run the test suite which also produces data.csf containing benchmarks

      - name: Test elpi on Unix
        if: runner.os != 'Windows' && matrix.profile != 'fatalwarnings'
        run: opam exec -- make tests RUNNERS='dune ${{ env.workspace }}/elpi-${{ matrix.ocaml-compiler }}-${{ runner.os }}.exe ${{ env.workspace }}/elpi-trace-elaborator-${{ matrix.ocaml-compiler }}-${{ runner.os }}.exe'

      - name: Test elpi on Windows
        if: runner.os == 'Windows' && matrix.profile != 'fatalwarnings'
        run: |
          opam exec -- ls -l tests/sources/*.elpi
          opam exec -- make tests PWD=${{ env.workspace }} RUNNERS='dune ${{ env.workspace }}/elpi-${{ matrix.ocaml-compiler }}-${{ runner.os }}.exe ${{ env.workspace }}/elpi-trace-elaborator-${{ matrix.ocaml-compiler }}-${{ runner.os }}.exe' TIME=--time=C:/.opam/.cygwin/root/bin/time.exe

# Test artifacts ################################################################

      - name: Save logs
        uses: actions/upload-artifact@v4
        if: matrix.profile != 'fatalwarnings'
        with:
          name: .logs-${{ matrix.ocaml-compiler }}-${{ runner.os }}
          path: _log
          retention-days: 1

      - name: Save benchmarking data
        uses: actions/upload-artifact@v4
        if: matrix.profile != 'fatalwarnings'
        with:
          name: .benchmark-${{ matrix.ocaml-compiler }}-${{ runner.os }}
          path: data.csv
          retention-days: 1

# Binary Artifacts ###############################################################
#
# Saved before ppx_elpi and elpi-lsp, so that a failure there does not lose
# them

      - name: Rename binary
        run: |
          opam exec -- mv ${{ env.workspace }}/elpi-${{ matrix.ocaml-compiler }}-${{ runner.os }}.exe ${{ env.workspace }}/elpi.exe
          opam exec -- mv ${{ env.workspace }}/elpi-trace-elaborator-${{ matrix.ocaml-compiler }}-${{ runner.os }}.exe ${{ env.workspace }}/elpi-trace-elaborator.exe

      - name: Save binary
        uses: actions/upload-artifact@v4
        if: matrix.profile != 'fatalwarnings'
        with:
          name: elpi-${{ matrix.ocaml-compiler }}-${{ runner.os }}
          path: elpi*.exe

# ppx_elpi ###################################################################
#
# Done last, so that it does not interfere with the above. ppx_elpi depends on
# elpi, passing both opam files makes the local elpi.opam satisfy that
# dependency.

      - name: Install ppx_elpi dependencies
        run: opam install ./elpi.opam ./ppx_elpi.opam --deps-only

      - name: Build ppx_elpi
        run: opam exec -- make build-ppx DUNE_OPTS=--verbose

      # the expected output depends on the version of ppx_deriving and ppxlib
      - name: Test ppx_elpi
        if: startsWith(matrix.ocaml-compiler, '5.')
        run: |
          opam install ./elpi.opam ./ppx_elpi.opam --deps-only --with-test
          opam exec -- make tests-ppx

# elpi-lsp ###################################################################
#
# Also done after the main tests: the language server depends on elpi, passing
# both opam files makes the local elpi.opam satisfy that dependency.

      - name: Install elpi-lsp dependencies
        run: |
          opam install ./elpi.opam ./elpi-lsp.opam --deps-only --with-test

      - name: Build elpi-lsp
        run: |
          opam exec -- make build-lsp DUNE_OPTS=--verbose
          opam exec -- cp _build/default/lsp/stdio_lsp_driver.exe elpi-lsp.exe
          opam exec -- chmod u+w ${{ env.workspace }}/elpi-lsp.exe
          opam exec -- strip ${{ env.workspace }}/elpi-lsp.exe

      - name: Save elpi-lsp binary
        uses: actions/upload-artifact@v4
        if: matrix.profile != 'fatalwarnings'
        with:
          name: elpi-lsp-${{ matrix.ocaml-compiler }}-${{ runner.os }}
          path: elpi-lsp.exe

      - name: Test elpi-lsp
        run: opam exec -- make tests-lsp

# webrunner ###################################################################
#
# Elpi on the web (release profile): the server and the API for JavaScript,
# compiled to JavaScript and to WebAssembly, on Linux. wasm_of_ocaml needs
# binaryen 119 or later, newer than the one of Ubuntu: a release of binaryen
# is put in the PATH instead.

      - name: Install binaryen
        if: runner.os == 'Linux' && matrix.profile != 'fatalwarnings'
        run: |
          curl -sL https://github.com/WebAssembly/binaryen/releases/download/version_120/binaryen-version_120-x86_64-linux.tar.gz | tar xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/binaryen-version_120/bin" >> "$GITHUB_PATH"

      - name: Build and test Elpi on the web
        if: runner.os == 'Linux' && matrix.profile != 'fatalwarnings'
        run: |
          opam install js_of_ocaml js_of_ocaml-compiler
          opam install --no-depexts wasm_of_ocaml-compiler
          opam exec -- make webrunner
          opam exec -- make test-webrunner

# The npm package of the web build, e.g. for webrunner/slidev: npm install
# elpi-webrunner-VERSION.tgz

      - name: Pack Elpi on the web (npm)
        if: runner.os == 'Linux' && matrix.ocaml-compiler == needs.versions.outputs.latest && matrix.profile != 'fatalwarnings'
        run: |
          git fetch --unshallow --tags || git fetch --tags
          opam exec -- make pack-webrunner

      - name: Save the npm package of Elpi on the web
        uses: actions/upload-artifact@v4
        if: runner.os == 'Linux' && matrix.ocaml-compiler == needs.versions.outputs.latest && matrix.profile != 'fatalwarnings'
        with:
          name: elpi-webrunner
          path: webrunner/elpi-webrunner/elpi-webrunner-*.tgz

  aggregate:
    name: Aggregate and plot benchmarking data
    runs-on: ubuntu-latest
    needs: build
    if: always()

    strategy:
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Install extra stuff
        run: |
          sudo apt-get update
          sudo apt-get install lua5.1 gnuplot

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: .benchmark*

      - name: Plotting aggregated data
        run: |
          cat .benchmark-*/data.csv > data.csv
          tests/plot data.csv
          gnuplot data.csv.plot

      - name: Save benchmarking plot
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-plot
          path: data.csv.svg
